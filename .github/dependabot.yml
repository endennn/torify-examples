version: 2
# サンプル用リポジトリのため、依存パッケージの自動更新 PR は抑制する。
# 本体 torify (private repo) の依存更新と同期するタイミングで手動更新する方針。
# Security advisory は GitHub から通知される (open-pull-requests-limit: 0 でも有効)。
updates:
  # TypeScript / npm dependencies (examples/typescript/)
  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0  # PR 自動作成停止 (security alert は維持)
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies (examples/python/)
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0  # PR 自動作成停止 (security alert は維持)
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions (if any added in the future)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0  # PR 自動作成停止 (security alert は維持)
    labels:
      - "dependencies"
      - "github-actions"
